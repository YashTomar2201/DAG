# Serves the static Vite build for apps/web.
#
# `try_files ... /index.html` is the standard single-page-app fallback: any
# path nginx doesn't have a matching static file for (a client-side route,
# a deep link, a browser refresh mid-session) falls back to index.html so
# the app's own JS can take over routing instead of nginx returning a 404.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively; index.html itself must
    # revalidate every time so a new deploy is picked up on next refresh.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
