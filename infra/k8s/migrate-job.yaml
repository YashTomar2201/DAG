# One-shot schema migration + dev seed, exactly like the compose `migrate`
# service. Runs as the `dag` superuser (MIGRATE_DATABASE_URL) because it does
# schema DDL and `CREATE ROLE dag_app` (the C2.1 migration). api/worker wait
# for this Job to complete before starting (see the wait-for-migrate
# initContainer in api.yaml / worker.yaml).
#
# Built from Dockerfile.api's `build` stage (tag dag-engine/migrate:local) —
# that stage still has the Prisma CLI, a devDependency the runtime image
# strips. See infra/k8s/README.md for the build command.
apiVersion: batch/v1
kind: Job
metadata:
  name: dag-migrate
spec:
  backoffLimit: 6
  # Keep finished pods briefly for `kubectl logs`, then auto-clean.
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: dag-migrate
    spec:
      restartPolicy: Never
      initContainers:
        # Postgres and this Job are created together on `kubectl apply`; on a
        # fresh node the postgres image pull + initdb can take longer than the
        # Job's backoff budget. Block here until the DB actually answers rather
        # than burning retries.
        - name: wait-for-postgres
          image: postgres:16
          command:
            - sh
            - -c
            - 'until pg_isready -h postgres -U dag -d dag_engine; do echo "waiting for postgres..."; sleep 3; done'
      containers:
        - name: migrate
          image: dag-engine/migrate:local
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - "pnpm --filter @dag/db run db:migrate:deploy && pnpm --filter @dag/db run db:seed"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dag-secrets
                  key: MIGRATE_DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
