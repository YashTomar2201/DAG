# Single-replica Postgres via a StatefulSet — stable network id (postgres-0),
# stable PVC, ordered start. A real deployment would use a managed database
# (RDS / Cloud SQL) or an operator (CloudNativePG); this is the "runs on
# kind with zero external dependencies" shape.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None # headless — StatefulSet stable DNS
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: dag
            - name: POSTGRES_DB
              value: dag_engine
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dag-secrets
                  key: POSTGRES_PASSWORD
            # Postgres refuses to initdb into a non-empty mount (the lost+found
            # dir on some volumes); a subdir keeps PGDATA clean.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "dag", "-d", "dag_engine"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "dag", "-d", "dag_engine"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 384Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
