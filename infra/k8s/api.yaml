# Control plane. Single replica for C3.1 (the orchestrator's QueueEvents
# consumer and the scheduler worker are safe to run singly; multi-replica
# api is a later concern).
#
# C3.2 probes:
#   livenessProbe  -> /health/live   (process up; no dependency check, so a
#                     transient Postgres/Redis blip can't trigger a restart loop)
#   readinessProbe -> /health/ready  (Postgres AND Redis reachable, and not
#                     mid-SIGTERM-drain; failure only pulls the pod from the
#                     Service — no restart)
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 3001
      targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      serviceAccountName: dag-job-watcher
      initContainers:
        - name: wait-for-migrate
          # Official Kubernetes-published kubectl image (registry.k8s.io) —
          # not bitnami/*, whose free Docker Hub images were deprecated in 2025.
          image: registry.k8s.io/kubectl:v1.31.0
          command: ["kubectl", "wait", "--for=condition=complete", "job/dag-migrate", "--timeout=300s"]
      containers:
        - name: api
          image: dag-engine/api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: dag-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dag-secrets
                  key: DATABASE_URL
            - name: METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dag-secrets
                  key: METRICS_TOKEN
            - name: EVENTS_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: dag-secrets
                  key: EVENTS_TOKEN_SECRET
          volumeMounts:
            - name: artifacts
              mountPath: /data/artifacts
          # startupProbe covers the tsx transpile-on-boot delay (the server
          # binds a few seconds after the container starts); liveness/readiness
          # don't begin until it first succeeds, so their own delays stay short.
          startupProbe:
            httpGet:
              path: /health/live
              port: 3001
            periodSeconds: 3
            failureThreshold: 20 # up to 60s to come up
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3001
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3001
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 160Mi
            limits:
              memory: 384Mi
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: dag-artifacts
