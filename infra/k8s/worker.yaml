# Data plane. Fixed replicas: 2 (roadmap C3.1 — "No autoscaling yet";
# KEDA arrives in C3.3). Pod anti-affinity is `preferred` (not `required`)
# so on a single-node cluster both replicas still schedule — on a multi-node
# cluster they spread across nodes, which with S3 artifacts lets a node
# running `preprocess` and a different node running `train` read each other's
# outputs.
#
# C3.2:
#   - a tiny node:http health server (apps/worker/src/health-server.ts) on
#     WORKER_HEALTH_PORT backs liveness (/health/live — process up) and
#     readiness (/health/ready — Redis + Postgres reachable, not mid-drain).
#   - terminationGracePeriodSeconds is raised to sit above a realistic
#     long-running job. worker.close() on SIGTERM stops new-job polling and
#     lets in-flight jobs finish; Kubernetes waits this long before SIGKILL,
#     so a `kubectl delete pod` / rolling update / scale-down mid-run lets the
#     job complete instead of cutting it off. torch.train's hard ceiling is 4h
#     (apps/worker/src/executors.ts) — 3600s covers a routine training job;
#     raise toward 14400 for an environment that runs multi-hour jobs and
#     wants zero forced kills on a drain.
#   - a PodDisruptionBudget (pdb.yaml) keeps a voluntary node drain from
#     evicting both replicas at once.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      serviceAccountName: dag-job-watcher
      terminationGracePeriodSeconds: 3600
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: worker
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-for-migrate
          # Official Kubernetes-published kubectl image (registry.k8s.io) —
          # not bitnami/*, whose free Docker Hub images were deprecated in 2025.
          image: registry.k8s.io/kubectl:v1.31.0
          command: ["kubectl", "wait", "--for=condition=complete", "job/dag-migrate", "--timeout=300s"]
      containers:
        - name: worker
          image: dag-engine/worker:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 3002
          envFrom:
            - configMapRef:
                name: dag-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dag-secrets
                  key: DATABASE_URL
          volumeMounts:
            - name: artifacts
              mountPath: /data/artifacts
          startupProbe:
            httpGet:
              path: /health/live
              port: health
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            periodSeconds: 15
          resources:
            requests:
              cpu: 150m
              memory: 320Mi
            limits:
              memory: 768Mi
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: dag-artifacts
