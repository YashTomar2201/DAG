# Dev-only secret values — every one of these MUST be replaced in a real
# deployment (use a sealed-secret / external-secrets / cloud secret manager;
# never commit real credentials). These match the compose stack's dev
# defaults so the two environments behave identically for local testing.
#
# Two DATABASE URLs, on purpose (roadmap C2.1): the migrate Job connects as
# the `dag` superuser because it runs schema DDL and CREATE ROLE; api + worker
# connect as the restricted `dag_app` role so Postgres RLS actually applies to
# their traffic (a superuser bypasses every RLS policy).
apiVersion: v1
kind: Secret
metadata:
  name: dag-secrets
type: Opaque
stringData:
  # Runtime traffic — restricted role, RLS enforced.
  DATABASE_URL: "postgresql://dag_app:dag_app_secret@postgres:5432/dag_engine"
  # Schema migrations + seed — superuser, DDL rights.
  MIGRATE_DATABASE_URL: "postgresql://dag:dag_secret@postgres:5432/dag_engine"
  METRICS_TOKEN: "k8s-dev-metrics-token"
  EVENTS_TOKEN_SECRET: "k8s-dev-events-token-secret"
  ARTIFACT_S3_ACCESS_KEY_ID: "dag-minio"
  ARTIFACT_S3_SECRET_ACCESS_KEY: "dag-minio-secret"
  # Consumed by the postgres StatefulSet itself.
  POSTGRES_PASSWORD: "dag_secret"
  # Consumed by the minio Deployment itself.
  MINIO_ROOT_USER: "dag-minio"
  MINIO_ROOT_PASSWORD: "dag-minio-secret"
